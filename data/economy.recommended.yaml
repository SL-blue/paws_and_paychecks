# Recommended tuning changes (overlay on data/economy.yaml), from sim/reports/SIM_REPORT.md §7.
# NOT yet applied to economy.yaml: pending owner review. `python -m sim.run --all` re-runs the
# whole matrix with `changes` merged on top of the baseline.

changes:
  start:
    cash: 1450                 # was 1400 (search result)
  pre_move_receivables:        # first invoice moved from day 6 to day 4; amounts unchanged
    - {day: 4,  amount: 600}
    - {day: 13, amount: 900}
    - {day: 24, amount: 500}
  effects:
    work_milestone_every: 8    # was 4

rationale:
  - key: effects.work_milestone_every
    from: 4
    to: 8
    why: "Jobs are mostly small (careful finishes ~24 per run), so 'every 4th job' gave ~5.6 work-milestone offers per careful run vs. the ~2-3 the spec expects (§8.1)."
    expected: "Work-milestone offers ~2.4 per careful run (in the §8.1 range). Effect boost and income fall slightly, so book-heavy needs a little more starting cash (next row)."
  - key: pre_move_receivables (day 6 -> 4)
    from: "600 on day 6"
    to: "600 on day 4"
    why: "In 30% of careful runs the lowest cash is day 5 (supplies + vet in week 1, before the first invoice), not the convergence week."
    expected: "Careful's lowest cash moves into days 28-35 more often (target >= 60%); week 1 still gets a payment. No change to total money."
  - key: start.cash
    from: 1400
    to: 1450
    why: "Re-balances book-heavy bankruptcy after the effect change (fewer effects -> less output)."
    expected: "Book-heavy bankruptcy back to ~30% (edge of the 15-30% band); careful stays <= 2%. Kept below 1500 because the careful policy buys headphones on day 1 at >= 1500, which re-creates the week-1 low (see Open issues)."
